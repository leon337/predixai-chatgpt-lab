name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
      - "pilot/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Scan repository for secrets
        run: python scripts/scan_secrets.py
      - name: Validate foundation contracts and schemas
        run: python scripts/validate_foundation.py
      - name: Validate pilot contracts
        run: python scripts/validate_pilot.py
      - name: Run tests
        run: python -m pytest -q
