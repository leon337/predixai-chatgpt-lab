name: Validate foundation

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate contracts and schemas
        run: python scripts/validate_foundation.py
      - name: Run tests
        run: python -m pytest -q
